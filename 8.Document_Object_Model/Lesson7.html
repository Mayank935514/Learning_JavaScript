<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- The main difference between async and defer in HTML <script> tags lies in their execution order and how they interact with 
        the page's loading process. async scripts execute as soon as they're downloaded, regardless of the order in which they appear 
        in the HTML, and potentially before the page is fully parsed. defer, on the other hand, executes scripts in the order they 
        appear in the HTML, but only after the page has finished parsing.  -->

    <script defer src=""></script>
    <script async src=""></script>
</head>

</body>
</html>
